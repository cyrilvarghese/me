<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cyril Varghese">
  <!-- The centre pin: the hinge every tool on the knife swings around and
       the point the compass needle turns on (CompassRose.tsx, which draws
       this same circle at r16 with a r5 dot). It is the one mark on the site
       that is already a single shape, so it survives being 16px across —
       where the CV stamp it replaced closed up into an unreadable smudge.

       Proportions are the pin's own: the ring a fifth of the radius, the
       dot a third of it. Colours are literal because a favicon renders
       outside the document and cannot read tokens.css; keep them in step
       with it by hand. (Token names are written bare in this comment on
       purpose, since an XML comment may not contain a double hyphen.)

       No plate behind it. The ring and the dot are accent red, so the mark
       holds on light browser chrome and on dark. -->
  <circle cx="16" cy="16" r="14" fill="#130f0f" stroke="#ea0000" stroke-width="2.8"/>
  <circle cx="16" cy="16" r="4.6" fill="#ea0000"/>
</svg>
