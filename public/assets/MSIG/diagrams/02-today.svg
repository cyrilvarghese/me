<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img"
     aria-label="The renewal journey — track, initiate, review, payment, confirm — held up by a missed alert, pending documents and a payment reminder the agent has to send.">
  <path d="M140,95 H660" fill="none" stroke="rgba(248,244,242,0.28)" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="2 14"/>

  <path d="M140,95 H660" fill="none" stroke="rgba(248,244,242,0.55)" stroke-width="3"
        stroke-linecap="round" pathLength="100"
        stroke-dasharray="100 100" stroke-dashoffset="100" class="ms-trail-520"/>

  <g fill="#1e1818" stroke="#eee8e6" stroke-width="3">
    <circle cx="140" cy="95" r="10"/>
    <circle cx="270" cy="95" r="10"/>
    <circle cx="400" cy="95" r="10"/>
    <circle cx="530" cy="95" r="10"/>
    <circle cx="660" cy="95" r="10"/>
  </g>

  <path d="M140,95 H660" fill="none" stroke="#ea0000" stroke-linecap="round" stroke-width="16"
        stroke-dasharray="0.01 519.99" class="ms-run-520"/>

  <g text-anchor="middle" style="font-weight:500;font-size:20px" fill="#eee8e6">
    <text x="140" y="52">Track</text>
    <text x="270" y="52">Initiate</text>
    <text x="400" y="52">Review</text>
    <text x="530" y="52">Payment</text>
    <text x="660" y="52">Confirm</text>
  </g>

  <!-- the journey never starts unless the agent remembers to look, so the
       first mark is the one that costs a policy -->
  <g fill="none" stroke="#ea0000" stroke-width="3" stroke-linecap="round">
    <g opacity="0" class="ms-at0"><path d="M132,126 L148,142 M148,126 L132,142"/></g>
    <g opacity="0" class="ms-at132"><path d="M392,126 L408,142 M408,126 L392,142"/></g>
    <g opacity="0" class="ms-at198"><path d="M522,126 L538,142 M538,126 L522,142"/></g>
  </g>

  <!-- rows alternate so neighbouring stages never share a line -->
  <g text-anchor="middle" style="font-weight:500;font-size:20px" fill="#ea0000">
    <text x="140" y="190" opacity="0" class="ms-at0">by memory</text>
    <text x="400" y="190" opacity="0" class="ms-at132">docs pending</text>
    <text x="530" y="230" opacity="0" class="ms-at198">agent reminds</text>
  </g>

  <!-- no cue at Initiate, so last year's cover is what gets renewed -->
  <text x="270" y="230" text-anchor="middle" style="font-weight:500;font-size:20px" fill="#9e9493"
        opacity="0" class="ms-at66">no upsell cue</text>

  <text x="400" y="285" text-anchor="middle" style="font-weight:500;font-size:20px" fill="#ea0000"
        opacity="0" class="ms-at400">miss the check and the policy lapses</text>
</svg>
