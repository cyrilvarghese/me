<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img"
     aria-label="The same new-policy journey with each spike handled: grouped fields that autosave at the quote, a legible status at submission, and payment tracked rather than chased.">
  <path d="M110,95 H690" fill="none" stroke="rgba(248,244,242,0.28)" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="2 14"/>

  <path d="M110,95 H690" fill="none" stroke="rgba(248,244,242,0.55)" stroke-width="3"
        stroke-linecap="round" pathLength="100"
        stroke-dasharray="100 100" stroke-dashoffset="100" class="ms-trail-580"/>

  <!-- the same six stages, drawn the same way: the difference the reader
       sees has to be the argument, not the styling -->
  <g fill="#1e1818" stroke="#eee8e6" stroke-width="3">
    <circle cx="110" cy="95" r="10"/>
    <circle cx="226" cy="95" r="10"/>
    <circle cx="342" cy="95" r="10"/>
    <circle cx="458" cy="95" r="10"/>
    <circle cx="574" cy="95" r="10"/>
    <circle cx="690" cy="95" r="10"/>
  </g>

  <path d="M110,95 H690" fill="none" stroke="#ea0000" stroke-linecap="round" stroke-width="16"
        stroke-dasharray="0.01 579.99" class="ms-run-580"/>

  <g text-anchor="middle" style="font-weight:500;font-size:20px" fill="#eee8e6">
    <text x="110" y="52">Lead</text>
    <text x="226" y="52">Quote</text>
    <text x="342" y="52">Review</text>
    <text x="458" y="52">Submit</text>
    <text x="574" y="52">Payment</text>
    <text x="690" y="52">Confirm</text>
  </g>

  <!-- the tick is the one red mark on this side: it is the whole difference -->
  <g fill="none" stroke="#ea0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M217,134 L226,143 L241,124" opacity="0" class="ms-at59"/>
    <path d="M449,134 L458,143 L473,124" opacity="0" class="ms-at177"/>
    <path d="M565,134 L574,143 L589,124" opacity="0" class="ms-at236"/>
  </g>

  <g text-anchor="middle" style="font-weight:500;font-size:20px" fill="#eee8e6">
    <text x="226" y="190" opacity="0" class="ms-at59">autosaved</text>
    <text x="574" y="190" opacity="0" class="ms-at236">tracked</text>
    <text x="458" y="230" opacity="0" class="ms-at177">status legible</text>
  </g>

  <text x="400" y="285" text-anchor="middle" style="font-weight:500;font-size:20px" fill="#9e9493"
        opacity="0" class="ms-at400">the same journey, nothing to chase</text>
</svg>
