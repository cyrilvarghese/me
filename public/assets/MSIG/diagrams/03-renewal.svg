<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"
     aria-label="The renewal journey — track, initiate, review, payment, confirm — with the agent's own words at each stage: a missed check lets the policy lapse, progress waits on customer documents, last year's cover is renewed unquestioned, and payments still need reminding.">
  <defs>
    <!-- red arrowhead: the leader from a quote to the cost it carries -->
    <marker id="msR-03" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea0000"/>
    </marker>
  </defs>

  <!-- the journey. Same quiet rail as the new-policy curve -->
  <path d="M170,560 C260,510 310,492 390,470 C470,448 540,418 620,415
           C710,412 810,440 900,478 C960,504 1040,540 1105,580"
        fill="none" stroke="rgba(248,244,242,0.35)" stroke-width="2"/>

  <!-- the five stages -->
  <g fill="#1e1818" stroke="#eee8e6" stroke-width="2">
    <circle cx="170" cy="560" r="5"/>
    <circle cx="390" cy="470" r="5"/>
    <circle cx="620" cy="415" r="5"/>
    <circle cx="900" cy="478" r="5"/>
    <circle cx="1105" cy="580" r="5"/>
  </g>
  <g font-size="13" fill="currentColor" opacity=".55" text-anchor="middle">
    <text x="170" y="590">Track</text>
    <text x="390" y="500">Initiate</text>
    <text x="620" y="443">Review</text>
    <text x="900" y="508">Payment</text>
    <text x="1105" y="610">Confirm</text>
  </g>

  <!-- 1 · the check nobody reminds her to make -->
  <image href="/assets/MSIG/icons/agent.png" x="272" y="498" width="36" height="36"/>
  <text x="90" y="478" font-size="12" fill="currentColor" opacity=".8">&#8220;If I forget to check,</text>
  <text x="90" y="498" font-size="12" fill="currentColor" opacity=".8">the policy just lapses.&#8221;</text>
  <circle cx="185" cy="450" r="3" fill="#ea0000"/>
  <path d="M185,450 V352" fill="none" stroke="#ea0000" stroke-opacity=".8"
        stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#msR-03)"/>
  <text x="90" y="336" font-size="13" font-weight="600" fill="currentColor">Missed alerts, lost renewals</text>

  <!-- 2 · progress parked on the customer's documents -->
  <image href="/assets/MSIG/icons/agent.png" x="602" y="350" width="36" height="36"/>
  <text x="620" y="300" font-size="12" fill="currentColor" opacity=".8" text-anchor="middle">&#8220;I can&#8217;t move ahead until the</text>
  <text x="620" y="320" font-size="12" fill="currentColor" opacity=".8" text-anchor="middle">customer sends their documents.&#8221;</text>
  <circle cx="620" cy="275" r="3" fill="#ea0000"/>
  <path d="M620,275 V174" fill="none" stroke="#ea0000" stroke-opacity=".8"
        stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#msR-03)"/>
  <text x="620" y="160" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">Pending docs, delayed progress</text>

  <!-- 3 · last year's cover, renewed unquestioned -->
  <image href="/assets/MSIG/icons/agent.png" x="432" y="552" width="36" height="36"/>
  <text x="480" y="575" font-size="12" fill="currentColor" opacity=".8">&#8220;I just renew what they had</text>
  <text x="480" y="595" font-size="12" fill="currentColor" opacity=".8">last year &#8212; I don&#8217;t know what</text>
  <text x="480" y="615" font-size="12" fill="currentColor" opacity=".8">else to offer.&#8221;</text>
  <circle cx="690" cy="600" r="3" fill="#ea0000"/>
  <path d="M690,600 V648" fill="none" stroke="#ea0000" stroke-opacity=".8"
        stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#msR-03)"/>
  <text x="690" y="674" font-size="13" font-weight="600" fill="currentColor" text-anchor="middle">No cues, lost upgrades</text>

  <!-- 4 · the payment she still has to chase -->
  <image href="/assets/MSIG/icons/agent.png" x="872" y="376" width="36" height="36"/>
  <text x="925" y="380" font-size="12" fill="currentColor" opacity=".8">&#8220;I still have to remind</text>
  <text x="925" y="400" font-size="12" fill="currentColor" opacity=".8">customers to make the</text>
  <text x="925" y="420" font-size="12" fill="currentColor" opacity=".8">payment.&#8221;</text>
  <circle cx="1010" cy="355" r="3" fill="#ea0000"/>
  <path d="M1010,355 V258" fill="none" stroke="#ea0000" stroke-opacity=".8"
        stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#msR-03)"/>
  <text x="880" y="246" font-size="13" font-weight="600" fill="currentColor">Manual payments, delayed revenue</text>

  <!-- legend -->
  <image href="/assets/MSIG/icons/agent.png" x="52" y="633" width="36" height="36"/>
  <text x="95" y="660" font-size="12" fill="currentColor" opacity=".6">Insurance agent</text>
</svg>
