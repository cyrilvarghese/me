<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img"
     aria-label="The same three blocks — stepper, form and details sidebar — restacked into a single phone column, so the task reflows instead of breaking.">
  <!-- the three blocks, as modules rather than one fixed screen -->
  <!-- neutral, exactly as on the other side: the blocks are the structure
       both drawings share, so nothing about them should look different -->
  <g stroke="rgba(248,244,242,0.5)" stroke-width="2" fill="#eee8e622">
    <rect x="70" y="74" width="180" height="52" rx="3"/>
    <rect x="70" y="142" width="180" height="52" rx="3"/>
    <rect x="70" y="210" width="180" height="52" rx="3"/>
  </g>

  <text x="160" y="46" text-anchor="middle" style="font-weight:500;font-size:20px" fill="#eee8e6">Stepper · Form · Sidebar</text>

  <!-- three runs of equal length, so they read as one reflow rather than a
       sequence of three decisions -->
  <g fill="none" stroke="rgba(248,244,242,0.28)" stroke-width="3" stroke-linecap="round"
     stroke-dasharray="2 14">
    <path d="M280,100 H512"/>
    <path d="M280,168 H512"/>
    <path d="M280,236 H512"/>
  </g>

  <g fill="none" stroke="rgba(248,244,242,0.55)" stroke-width="3" stroke-linecap="round"
     pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100">
    <path d="M280,100 H512" class="ms-trail-232"/>
    <path d="M280,168 H512" class="ms-trail-232"/>
    <path d="M280,236 H512" class="ms-trail-232"/>
  </g>

  <g fill="none" stroke="#ea0000" stroke-linecap="round" stroke-width="16"
     stroke-dasharray="0.01 231.99">
    <path d="M280,100 H512" class="ms-run-232"/>
    <path d="M280,168 H512" class="ms-run-232"/>
    <path d="M280,236 H512" class="ms-run-232"/>
  </g>

  <!-- the phone, holding the same three blocks in one column -->
  <rect x="520" y="46" width="150" height="244" rx="16"
        fill="#1e1818" stroke="rgba(248,244,242,0.28)" stroke-width="2"/>

  <g stroke="rgba(248,244,242,0.5)" stroke-width="2" fill="#eee8e622" opacity="0" class="ms-at118">
    <rect x="538" y="70" width="114" height="58" rx="3"/>
    <rect x="538" y="140" width="114" height="58" rx="3"/>
    <rect x="538" y="210" width="114" height="58" rx="3"/>
  </g>

  <!-- the tick sits level with the middle of the phone, so it reads as a
       verdict on the whole device rather than on one block -->
  <g fill="none" stroke="#ea0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
     opacity="0" class="ms-at118">
    <path d="M700,168 L711,179 L729,157"/>
  </g>

  <text x="595" y="324" text-anchor="middle" style="font-weight:500;font-size:20px" fill="#9e9493"
        opacity="0" class="ms-at400">the same flow, in the hand</text>
</svg>
