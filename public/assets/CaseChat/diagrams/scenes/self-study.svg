<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img"
     aria-label="One student at a desk between two tall stacks of textbooks, one hand up to their head, working something out alone.">
  <!-- The argument is the ratio: one person, two stacks taller than they
       are. Slabs rather than drawn books — at panel width a spine line
       reads as noise, a value step reads as a book.

       The posture is the whole point of the drawing. Hunched over a page
       reads as "reading"; hand to the head with the elbow swung out reads
       as "working it out", which is what self study actually costs. The
       arm is one explicit filled path rather than two thick strokes so
       the notch between forearm and head is drawn, not left to chance —
       stroked segments at this scale close the gap and the pose dies. -->

  <!-- the thinker -->
  <path d="M134 176 L134 134 C134 120 144 112 158 112 L180 112 C194 112 202 120 202 134 L202 176 Z" fill="#e7e3e1"/>
  <rect x="168" y="100" width="18" height="14" fill="#e7e3e1"/>
  <circle cx="176" cy="86" r="18" fill="#e7e3e1"/>
  <path d="M198 130 L208 162" stroke="#e7e3e1" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M146 139 L109 158 L99 152 L99 145 L154 74 L166 84 L136 124 Z" fill="#e7e3e1"/>

  <!-- desk -->
  <rect x="-2" y="172" width="324" height="9" fill="#1e1818" stroke="#f8f4f2" stroke-opacity=".22" stroke-width="1.5"/>
  <rect x="-2" y="181" width="324" height="7" fill="#f8f4f2" fill-opacity=".05"/>

  <!-- left stack — the read pile, further back and dimmer -->
  <g fill="#f8f4f2" fill-opacity=".24">
    <rect x="5" y="163" width="86" height="11"/>
    <rect x="8" y="150" width="80" height="11"/>
    <rect x="4" y="137" width="88" height="11"/>
    <rect x="7" y="124" width="82" height="11"/>
    <rect x="10" y="111" width="76" height="11"/>
    <rect x="6" y="98" width="84" height="11"/>
  </g>

  <!-- right stack — the unread pile, nearer and taller than the reader -->
  <g fill="#f8f4f2" fill-opacity=".34">
    <rect x="218" y="163" width="92" height="11"/>
    <rect x="221" y="150" width="86" height="11"/>
    <rect x="217" y="137" width="94" height="11"/>
    <rect x="220" y="124" width="88" height="11"/>
    <rect x="223" y="111" width="82" height="11"/>
    <rect x="219" y="98" width="90" height="11"/>
    <rect x="222" y="85" width="84" height="11"/>
    <rect x="225" y="72" width="78" height="11"/>
  </g>

  <!-- the open page, the one thing actually being worked through -->
  <path d="M100 171 L125 158 L125 167 L100 175 Z" fill="#f8f4f2" fill-opacity=".62"/>
  <path d="M150 171 L125 158 L125 167 L150 175 Z" fill="#f8f4f2" fill-opacity=".46"/>
</svg>
