<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img"
     aria-label="One student at a desk between two stacks of textbooks taller than they are.">
  <!-- The argument is the ratio: one person, two stacks taller than they
       are. Slabs rather than drawn books — at panel width a spine line
       reads as noise, a value step reads as a book.

       The figure is the same head-and-shoulders mark the lecture rows
       use, drawn large. A posed figure — hunched, or hand to the head —
       reads as a puzzle at this size and pulls attention off the stacks,
       which are the thing making the point.

       Learning material carries a tinge of the accent: #b39a9a is the
       first step of the ramp in the diagram skill, so the tint stays
       inside the one-hue rule rather than introducing a second colour. -->

  <!-- the student -->
  <circle cx="158" cy="112" r="22" fill="#e7e3e1"/>
  <path d="M114 178a44 46 0 0 1 88 0z" fill="#e7e3e1"/>

  <!-- desk -->
  <rect x="-2" y="172" width="324" height="9" fill="#1e1818" stroke="#f8f4f2" stroke-opacity=".22" stroke-width="1.5"/>
  <rect x="-2" y="181" width="324" height="7" fill="#f8f4f2" fill-opacity=".05"/>

  <!-- left stack — the read pile, further back and dimmer -->
  <g fill="#b39a9a" fill-opacity=".32">
    <rect x="5" y="163" width="86" height="11"/>
    <rect x="8" y="150" width="80" height="11"/>
    <rect x="4" y="137" width="88" height="11"/>
    <rect x="7" y="124" width="82" height="11"/>
    <rect x="10" y="111" width="76" height="11"/>
    <rect x="6" y="98" width="84" height="11"/>
  </g>

  <!-- right stack — the unread pile, nearer and taller than the student -->
  <g fill="#b39a9a" fill-opacity=".44">
    <rect x="218" y="163" width="92" height="11"/>
    <rect x="221" y="150" width="86" height="11"/>
    <rect x="217" y="137" width="94" height="11"/>
    <rect x="220" y="124" width="88" height="11"/>
    <rect x="223" y="111" width="82" height="11"/>
    <rect x="219" y="98" width="90" height="11"/>
    <rect x="222" y="85" width="84" height="11"/>
    <rect x="225" y="72" width="78" height="11"/>
  </g>

  <!-- the open page: the one book actually being worked through. It has to
       reach past the shoulders — held narrower than the figure it stops
       reading as a book on a desk and starts reading as a stripe on a shirt. -->
  <path d="M98 172 L158 152 L158 164 L98 176 Z" fill="#b39a9a" fill-opacity=".78"/>
  <path d="M214 172 L158 152 L158 164 L214 176 Z" fill="#b39a9a" fill-opacity=".60"/>
</svg>
