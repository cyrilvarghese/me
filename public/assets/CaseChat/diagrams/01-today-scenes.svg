<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img"
     aria-label="Three rooms a student learns in — a lecture hall, a desk of textbooks, a bedside — and the share of the week each one takes. Only the bedside is hands on, and it is the smallest share.">
  <!-- The scenes carry the argument and the chart carries the size of it.
       Red appears exactly twice: on the hands touching a patient, and on
       the wedge that measures how rarely that happens. -->
  <defs>
    <marker id="ccsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f8f4f2" fill-opacity=".45"/>
    </marker>
    <marker id="ccsR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea0000"/>
    </marker>
  </defs>

  <!-- ══ the lecture hall ══════════════════════════════════════════ -->
  <g class="cc-in" style="--d:.05s" transform="translate(30 30) scale(0.86)">
    <rect x="186" y="22" width="112" height="66" fill="#1e1818"/>
    <rect x="186" y="22" width="112" height="66" fill="#b39a9a" fill-opacity=".10" stroke="#b39a9a" stroke-opacity=".45" stroke-width="2"/>
    <rect x="200" y="40" width="60" height="4" fill="#b39a9a" fill-opacity=".38"/>
    <rect x="200" y="52" width="84" height="4" fill="#b39a9a" fill-opacity=".38"/>
    <rect x="200" y="64" width="44" height="4" fill="#b39a9a" fill-opacity=".38"/>
    <rect x="88" y="100" width="64" height="5" fill="#9e9493" fill-opacity=".55"/>
    <rect x="93" y="105" width="3" height="27" fill="#9e9493" fill-opacity=".35"/>
    <rect x="144" y="105" width="3" height="27" fill="#9e9493" fill-opacity=".35"/>
    <circle cx="168" cy="82" r="6" fill="#e7e3e1"/>
    <path d="M161 87 L175 87 L178 132 L158 132 Z" fill="#e7e3e1"/>
    <path d="M175 96 L196 88 L198 93 L176 102 Z" fill="#e7e3e1"/>
    <rect x="0" y="132" width="320" height="1.5" fill="#f8f4f2" fill-opacity=".12"/>
    <g fill="#f8f4f2" fill-opacity=".22">
      <circle cx="20" cy="118" r="5.5"/><path d="M9 136a11 11 0 0 1 22 0z"/>
      <circle cx="60" cy="118" r="5.5"/><path d="M49 136a11 11 0 0 1 22 0z"/>
      <circle cx="100" cy="118" r="5.5"/><path d="M89 136a11 11 0 0 1 22 0z"/>
      <circle cx="140" cy="118" r="5.5"/><path d="M129 136a11 11 0 0 1 22 0z"/>
      <circle cx="180" cy="118" r="5.5"/><path d="M169 136a11 11 0 0 1 22 0z"/>
      <circle cx="220" cy="118" r="5.5"/><path d="M209 136a11 11 0 0 1 22 0z"/>
      <circle cx="260" cy="118" r="5.5"/><path d="M249 136a11 11 0 0 1 22 0z"/>
      <circle cx="300" cy="118" r="5.5"/><path d="M289 136a11 11 0 0 1 22 0z"/>
    </g>
    <rect x="-2" y="136" width="324" height="9" fill="#1e1818" stroke="#f8f4f2" stroke-opacity=".20" stroke-width="1.5"/>
    <g fill="#f8f4f2" fill-opacity=".34">
      <circle cx="24" cy="143" r="6.5"/><path d="M11 164a13 13 0 0 1 26 0z"/>
      <circle cx="70" cy="143" r="6.5"/><path d="M57 164a13 13 0 0 1 26 0z"/>
      <circle cx="116" cy="143" r="6.5"/><path d="M103 164a13 13 0 0 1 26 0z"/>
      <circle cx="162" cy="143" r="6.5"/><path d="M149 164a13 13 0 0 1 26 0z"/>
      <circle cx="208" cy="143" r="6.5"/><path d="M195 164a13 13 0 0 1 26 0z"/>
      <circle cx="254" cy="143" r="6.5"/><path d="M241 164a13 13 0 0 1 26 0z"/>
      <circle cx="300" cy="143" r="6.5"/><path d="M287 164a13 13 0 0 1 26 0z"/>
    </g>
    <rect x="-2" y="164" width="324" height="10" fill="#1e1818" stroke="#f8f4f2" stroke-opacity=".20" stroke-width="1.5"/>
    <g fill="#9e9493">
      <circle cx="16" cy="168" r="7.5"/><path d="M0 192a16 15 0 0 1 32 0z"/>
      <circle cx="72" cy="168" r="7.5"/><path d="M56 192a16 15 0 0 1 32 0z"/>
      <circle cx="128" cy="168" r="7.5"/><path d="M112 192a16 15 0 0 1 32 0z"/>
      <circle cx="184" cy="168" r="7.5"/><path d="M168 192a16 15 0 0 1 32 0z"/>
      <circle cx="240" cy="168" r="7.5"/><path d="M224 192a16 15 0 0 1 32 0z"/>
      <circle cx="296" cy="168" r="7.5"/><path d="M280 192a16 15 0 0 1 32 0z"/>
    </g>
    <rect x="-2" y="192" width="324" height="12" fill="#1e1818" stroke="#f8f4f2" stroke-opacity=".20" stroke-width="1.5"/>
  </g>

  <text class="cc-in" style="--d:.5s" x="30" y="238" font-size="22" fill="#e7e3e1">Lectures</text>
  <text class="cc-in" style="--d:.55s" x="30" y="266" font-size="19" fill="#9e9493">150 students, one topic</text>

  <!-- ══ the desk ══════════════════════════════════════════════════ -->
  <g class="cc-in" style="--d:.15s" transform="translate(30 372) scale(0.86)">
    <circle cx="158" cy="112" r="22" fill="#e7e3e1"/>
    <path d="M114 178a44 46 0 0 1 88 0z" fill="#e7e3e1"/>
    <rect x="-2" y="172" width="324" height="9" fill="#1e1818" stroke="#f8f4f2" stroke-opacity=".22" stroke-width="1.5"/>
    <rect x="-2" y="181" width="324" height="7" fill="#f8f4f2" fill-opacity=".05"/>
    <g fill="#b39a9a" fill-opacity=".32">
      <rect x="5" y="163" width="86" height="11"/>
      <rect x="8" y="150" width="80" height="11"/>
      <rect x="4" y="137" width="88" height="11"/>
      <rect x="7" y="124" width="82" height="11"/>
      <rect x="10" y="111" width="76" height="11"/>
      <rect x="6" y="98" width="84" height="11"/>
    </g>
    <g fill="#b39a9a" fill-opacity=".44">
      <rect x="218" y="163" width="92" height="11"/>
      <rect x="221" y="150" width="86" height="11"/>
      <rect x="217" y="137" width="94" height="11"/>
      <rect x="220" y="124" width="88" height="11"/>
      <rect x="223" y="111" width="82" height="11"/>
      <rect x="219" y="98" width="90" height="11"/>
      <rect x="222" y="85" width="84" height="11"/>
      <rect x="225" y="72" width="78" height="11"/>
    </g>
    <path d="M98 172 L158 152 L158 164 L98 176 Z" fill="#b39a9a" fill-opacity=".78"/>
    <path d="M214 172 L158 152 L158 164 L214 176 Z" fill="#b39a9a" fill-opacity=".60"/>
  </g>

  <text class="cc-in" style="--d:.6s" x="30" y="580" font-size="22" fill="#e7e3e1">Books and self study</text>
  <text class="cc-in" style="--d:.65s" x="30" y="608" font-size="19" fill="#9e9493">Dense reference textbooks, read alone</text>

  <!-- ══ the bedside ═══════════════════════════════════════════════ -->
  <text class="cc-in" style="--d:.9s" x="596" y="48" font-size="22" fill="#ea0000">Only 20% of the time</text>
  <text class="cc-in" style="--d:.9s" x="596" y="76" font-size="22" fill="#ea0000">is spent hands on</text>

  <g class="cc-in" style="--d:.25s" transform="translate(596 100) scale(0.86)">
    <g fill="#f8f4f2" fill-opacity=".20">
      <circle cx="58" cy="74" r="8"/><path d="M45 86 L71 86 L74 150 L42 150 Z"/>
      <circle cx="92" cy="70" r="8"/><path d="M79 82 L105 82 L108 150 L76 150 Z"/>
      <circle cx="126" cy="76" r="8"/><path d="M113 88 L139 88 L142 150 L110 150 Z"/>
      <circle cx="160" cy="72" r="8"/><path d="M147 84 L173 84 L176 150 L144 150 Z"/>
      <circle cx="194" cy="78" r="8"/><path d="M181 90 L207 90 L210 150 L178 150 Z"/>
    </g>
    <rect x="52" y="154" width="5" height="28" fill="#9e9493" fill-opacity=".45"/>
    <rect x="272" y="154" width="5" height="28" fill="#9e9493" fill-opacity=".45"/>
    <rect x="48" y="130" width="46" height="11" fill="#f8f4f2" fill-opacity=".22"/>
    <rect x="40" y="140" width="244" height="14" fill="#1e1818" stroke="#f8f4f2" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="74" cy="124" r="9" fill="#b39a9a"/>
    <path d="M86 140 C96 122 118 122 142 126 C162 130 176 133 190 133 C198 118 218 116 226 132 C242 136 256 138 268 140 Z" fill="#b39a9a"/>
    <circle cx="280" cy="58" r="11" fill="#e7e3e1"/>
    <path d="M268 80 L298 80 L304 184 L290 184 L284 140 L278 184 L264 184 Z" fill="#e7e3e1"/>
    <path d="M266 70 L294 82 L214 130 L198 118 Z" fill="#e7e3e1"/>
    <circle class="cc-beat" cx="204" cy="126" r="14" fill="#ea0000" fill-opacity=".18"/>
    <circle cx="204" cy="126" r="7" fill="#ea0000"/>
  </g>

  <text class="cc-in" style="--d:.7s" x="596" y="308" font-size="22" fill="#e7e3e1">Bedside teaching</text>
  <text class="cc-in" style="--d:.75s" x="596" y="336" font-size="19" fill="#9e9493">Watching a doctor work</text>
  <text class="cc-in" style="--d:.75s" x="596" y="360" font-size="19" fill="#9e9493">a real patient</text>

  <!-- ══ the share of the week ═════════════════════════════════════ -->
  <!-- Wedges are placed so each one faces the room it measures: lectures
       upper-left, books below, bedside out to the right. -->
  <g class="cc-in" style="--d:.35s">
    <path d="M450 300 L516.3 251.8 A82 82 0 0 0 372 325.3 Z" fill="#f8f4f2" fill-opacity=".22" stroke="#f8f4f2" stroke-opacity=".28" stroke-width="2"/>
    <path d="M450 300 L372 325.3 A82 82 0 0 0 516.3 348.2 Z" fill="#f8f4f2" fill-opacity=".13" stroke="#f8f4f2" stroke-opacity=".28" stroke-width="2"/>
    <path transform="translate(10 0)" d="M450 300 L516.3 251.8 A82 82 0 0 1 516.3 348.2 Z" fill="#ea0000" fill-opacity=".85" stroke="#ea0000" stroke-width="2"/>

    <text x="428" y="263" font-size="22" text-anchor="middle" fill="#f8f4f2" fill-opacity=".75">45%</text>
    <text x="442" y="356" font-size="22" text-anchor="middle" fill="#f8f4f2" fill-opacity=".75">35%</text>
    <text x="512" y="308" font-size="22" text-anchor="middle" fill="#f8f4f2">20%</text>
  </g>

  <!-- ══ rails ═════════════════════════════════════════════════════ -->
  <g class="cc-in" style="--d:.8s" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14">
    <path d="M316 180 L372 180 L409 224" stroke="#f8f4f2" stroke-opacity=".28" marker-end="url(#ccsA)"/>
    <path d="M316 430 L378 430 L433 385" stroke="#f8f4f2" stroke-opacity=".28" marker-end="url(#ccsA)"/>
    <path d="M586 200 L560 200 L548 290" stroke="#ea0000" stroke-opacity=".6" marker-end="url(#ccsR)"/>
  </g>
  <!-- Nodes sit on the panel edge they belong to. Floated off into the gap
       they read as loose punctuation rather than as "this room, measured". -->
  <g class="cc-in" style="--d:.8s" fill="#1e1818" stroke-width="2">
    <circle cx="308" cy="180" r="5.5" stroke="#f8f4f2" stroke-opacity=".45"/>
    <circle cx="308" cy="430" r="5.5" stroke="#f8f4f2" stroke-opacity=".45"/>
    <circle cx="594" cy="200" r="5.5" stroke="#ea0000"/>
  </g>
</svg>
