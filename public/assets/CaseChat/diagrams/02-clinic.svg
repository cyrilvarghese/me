<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img"
     aria-label="Six stages of care — pick a patient, take history, order tests, diagnose, treat, read the feedback — closing back on themselves, with a new patient every time round.">
  <!-- The same six stages as a real consultation, drawn as a circuit
       rather than a list, because the closing edge is the product: the
       student comes out of feedback and straight into another patient. -->
  <circle cx="280" cy="200" r="120" fill="none" stroke="currentColor" stroke-opacity=".18"/>
  <circle class="cc-orbit" cx="280" cy="200" r="120" fill="none" stroke="#ea0000" stroke-opacity=".7" style="--len:754"/>

  <!-- direction, stated once per arc so the loop reads clockwise -->
  <g fill="#ea0000" fill-opacity=".8">
    <path d="M-5 -4 L5 0 L-5 4 z" transform="translate(340 96) rotate(30)"/>
    <path d="M-5 -4 L5 0 L-5 4 z" transform="translate(400 200) rotate(90)"/>
    <path d="M-5 -4 L5 0 L-5 4 z" transform="translate(340 304) rotate(150)"/>
    <path d="M-5 -4 L5 0 L-5 4 z" transform="translate(220 304) rotate(210)"/>
    <path d="M-5 -4 L5 0 L-5 4 z" transform="translate(160 200) rotate(270)"/>
    <path d="M-5 -4 L5 0 L-5 4 z" transform="translate(220 96) rotate(330)"/>
  </g>

  <!-- nodes punched out of the ring so the stages read as stops on it -->
  <g fill="#1e1818" stroke="currentColor" stroke-opacity=".5">
    <circle class="cc-in" style="--d:.15s" cx="280" cy="80" r="6"/>
    <circle class="cc-in" style="--d:.25s" cx="384" cy="140" r="6"/>
    <circle class="cc-in" style="--d:.35s" cx="384" cy="260" r="6"/>
    <circle class="cc-in" style="--d:.45s" cx="280" cy="320" r="6"/>
    <circle class="cc-in" style="--d:.55s" cx="176" cy="260" r="6"/>
    <circle class="cc-in" style="--d:.65s" cx="176" cy="140" r="6"/>
  </g>

  <g font-size="12" fill="currentColor" opacity=".8">
    <text class="cc-in" style="--d:.15s" x="280" y="58" text-anchor="middle">1 · PICK A PATIENT</text>
    <text class="cc-in" style="--d:.25s" x="400" y="136">2 · TAKE HISTORY</text>
    <text class="cc-in" style="--d:.35s" x="400" y="264">3 · ORDER TESTS</text>
    <text class="cc-in" style="--d:.45s" x="280" y="346" text-anchor="middle">4 · DIAGNOSE</text>
    <text class="cc-in" style="--d:.55s" x="160" y="264" text-anchor="end">5 · TREAT</text>
    <text class="cc-in" style="--d:.65s" x="160" y="136" text-anchor="end">6 · FEEDBACK</text>
  </g>

  <text x="280" y="196" font-size="15" text-anchor="middle" fill="#ea0000">VIRTUAL CLINIC</text>
  <text x="280" y="216" font-size="12" text-anchor="middle" fill="currentColor" opacity=".5">unlimited patients</text>

  <!-- the closing edge, named. It sits clear of the ring with a leader
       rather than crowding the arc it annotates. -->
  <g class="cc-in" style="--d:1s" fill="#ea0000">
    <text x="186" y="62" font-size="12" text-anchor="end">and again —</text>
    <text x="186" y="78" font-size="12" text-anchor="end">a new patient</text>
    <line x1="194" y1="82" x2="228" y2="98" stroke="#ea0000" stroke-opacity=".55"/>
  </g>
</svg>
