<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img"
     aria-label="Six stages of care around a virtual clinic — pick a patient, take history, order tests, diagnose, treat, read the feedback — closing back on themselves, with a new patient every time round.">
  <!-- The same six stages as a real consultation, drawn as a circuit
       rather than a list, because the closing edge is the product: the
       student comes out of feedback and straight into another patient.

       Each stop carries the icon that names it elsewhere in this case
       study, so the ring and the object diagram share one vocabulary. The
       marks are <image> inside an inlined svg, not an <img> around one:
       the file still inlines, so the text keeps the mono voice and the
       animation still sees the shared motion sheet.

       No arrowheads. The runner going round states the direction, and the
       numbers state it again for anyone the motion never reaches.

       Sized for a full-width band rather than half a compare panel, so it
       renders near 1:1 and the labels are the ladder's own numbers — 15
       for a stage, 20 for the name at the centre. -->
  <defs>
    <!-- Backlight instead of a disc. Supplied clip-art is drawn with dark
         outlines that vanish on this ground and wants something behind it,
         but a hard white plate cuts six holes in the drawing. A glow that
         falls off to nothing lifts the mark without drawing an edge. -->
    <radialGradient id="ccGlow">
      <stop offset="0%" stop-color="#f8f4f2" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#f8f4f2" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#f8f4f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The lap, as one path so the ground, the trail and the runner are
       the same geometry rather than three that have to be kept in step.
       Clockwise from the top: 2πr = 1571 units, and the house dash travels
       246 of them a second, so a lap takes 6.4s.

       The stroke numbers are 02-canvas's, unscaled, and that is the point:
       it renders at 0.95px per unit and this renders at 1.04, so both are
       1:1 and a viewBox unit is a pixel in each. Scaling them by the ratio
       of the two boxes (1100/548) painted the rail twice as thick and the
       dash twice as far apart as the diagram it was copying. What has to
       match is the mark on screen, not the number in the file.

       Ground 2.06 on "2 14", trail 2.4, runner 3.4 on a 9.6 dash. The
       runner is the heaviest of the three and the ground the lightest, so
       the travelling mark reads as riding a thinner line. The trail is the
       light one and the runner the red one, the way round 02-canvas has
       it — a trail in the accent turns the whole ring red and leaves
       nothing for the moment that matters. -->
  <g fill="none">
    <path d="M550 80 A250 250 0 1 1 550 580 A250 250 0 1 1 550 80"
          stroke="rgba(248,244,242,0.24)" stroke-width="2.06"
          stroke-linecap="round" stroke-dasharray="2 14"/>

    <path class="cc-trail" pathLength="100"
          d="M550 80 A250 250 0 1 1 550 580 A250 250 0 1 1 550 80"
          stroke="#eee8e6" stroke-width="2.4" stroke-linecap="round"
          style="--dur:6.4s"/>

    <path class="cc-run"
          d="M550 80 A250 250 0 1 1 550 580 A250 250 0 1 1 550 80"
          stroke="#ea0000" stroke-width="3.4" stroke-linecap="round"
          style="--len:1571; --dash:9.6; --dur:6.4s"/>
  </g>

  <!-- The clinic the loop runs inside. Larger than the stops, because it
       is the thing they all belong to rather than one more of them.

       The centre band ends at y402 and the stops at 3 and 5 start at y411.
       Placed by eye against the ring instead, the second line runs into
       their row. -->
  <g class="cc-in" style="--d:.05s">
    <circle cx="550" cy="282" r="62" fill="url(#ccGlow)"/>
    <image href="/assets/CaseChat/icons/clinic.png" x="518" y="250" width="64" height="64"/>
  </g>
  <text class="cc-in" style="--d:.05s" x="550" y="374" font-size="20" text-anchor="middle" fill="#ea0000">VIRTUAL CLINIC</text>
  <text class="cc-in" style="--d:.05s" x="550" y="397" font-size="15" text-anchor="middle" fill="currentColor" opacity=".5">unlimited patients</text>

  <!-- The six stops. Backlight, ping, mark and label move together, so a
       stage arrives as one thing rather than four that happen to line up.
       Each ping's --d is that stop's share of the lap — a sixth apart —
       so it fires as the runner actually reaches it. -->
  <g font-size="15" fill="currentColor">
    <g class="cc-in" style="--d:.15s">
      <circle class="cc-ping" cx="550" cy="80" r="30" fill="none" stroke="#ea0000" stroke-width="2" style="--dur:6.4s; --d:0s"/>
      <circle cx="550" cy="80" r="52" fill="url(#ccGlow)"/>
      <image href="/assets/CaseChat/icons/Patient.png" x="522.5" y="52.5" width="55" height="55"/>
      <text x="550" y="12" text-anchor="middle" opacity=".8">1 · PICK A PATIENT</text>
    </g>

    <g class="cc-in" style="--d:.25s">
      <circle class="cc-ping" cx="766.5" cy="205" r="30" fill="none" stroke="#ea0000" stroke-width="2" style="--dur:6.4s; --d:1.067s"/>
      <circle cx="766.5" cy="205" r="52" fill="url(#ccGlow)"/>
      <image href="/assets/CaseChat/icons/patient-history.png" x="739" y="177.5" width="55" height="55"/>
      <text x="833" y="211" opacity=".8">2 · TAKE HISTORY</text>
    </g>

    <g class="cc-in" style="--d:.35s">
      <circle class="cc-ping" cx="766.5" cy="455" r="30" fill="none" stroke="#ea0000" stroke-width="2" style="--dur:6.4s; --d:2.133s"/>
      <circle cx="766.5" cy="455" r="52" fill="url(#ccGlow)"/>
      <image href="/assets/CaseChat/icons/test.png" x="739" y="427.5" width="55" height="55"/>
      <text x="833" y="461" opacity=".8">3 · ORDER TESTS</text>
    </g>

    <g class="cc-in" style="--d:.45s">
      <circle class="cc-ping" cx="550" cy="580" r="30" fill="none" stroke="#ea0000" stroke-width="2" style="--dur:6.4s; --d:3.2s"/>
      <circle cx="550" cy="580" r="52" fill="url(#ccGlow)"/>
      <image href="/assets/CaseChat/icons/diagnosis.png" x="522.5" y="552.5" width="55" height="55"/>
      <text x="550" y="652" text-anchor="middle" opacity=".8">4 · DIAGNOSE</text>
    </g>

    <g class="cc-in" style="--d:.55s">
      <circle class="cc-ping" cx="333.5" cy="455" r="30" fill="none" stroke="#ea0000" stroke-width="2" style="--dur:6.4s; --d:4.267s"/>
      <circle cx="333.5" cy="455" r="52" fill="url(#ccGlow)"/>
      <image href="/assets/CaseChat/icons/treatment.png" x="306" y="427.5" width="55" height="55"/>
      <text x="267" y="461" text-anchor="end" opacity=".8">5 · TREAT</text>
    </g>

    <g class="cc-in" style="--d:.65s">
      <circle class="cc-ping" cx="333.5" cy="205" r="30" fill="none" stroke="#ea0000" stroke-width="2" style="--dur:6.4s; --d:5.333s"/>
      <circle cx="333.5" cy="205" r="52" fill="url(#ccGlow)"/>
      <image href="/assets/CaseChat/icons/Feedback.png" x="306" y="177.5" width="55" height="55"/>
      <text x="267" y="211" text-anchor="end" opacity=".8">6 · FEEDBACK</text>
    </g>
  </g>

  <!-- the closing edge, named. It sits clear of the ring with a leader
       rather than crowding the arc it annotates. -->
  <g class="cc-in" style="--d:1s" fill="#ea0000">
    <text x="300" y="92" font-size="15" text-anchor="end">and again —</text>
    <text x="300" y="114" font-size="15" text-anchor="end">a new patient</text>
    <line x1="308" y1="106" x2="392" y2="122" stroke="#ea0000" stroke-opacity=".55" stroke-width="1.5"/>
  </g>
</svg>
