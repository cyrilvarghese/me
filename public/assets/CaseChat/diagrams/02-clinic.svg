<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img"
     aria-label="Six stages of care around a virtual clinic — pick a patient, take history, order tests, diagnose, treat, read the feedback — closing back on themselves, with a new patient every time round.">
  <!-- The same six stages as a real consultation, drawn as a circuit
       rather than a list, because the closing edge is the product: the
       student comes out of feedback and straight into another patient.

       Each stop carries the icon that names it elsewhere in this case
       study, so the ring and the object diagram share one vocabulary.
       Supplied clip-art is drawn with black outlines that vanish on this
       ground, so every mark sits on the light disc the diagram skill
       reserves for artwork it did not draw — colours untouched, because a
       filtered logo reads as a smudge rather than a mark.

       The icons are <image> inside an inlined svg, not an <img> around
       one: the file still inlines, so the text keeps the mono voice and
       the animation still sees the shared motion sheet.

       Sized for a full-width band rather than half a compare panel, so it
       renders near 1:1 and the labels are the ladder's own numbers — 15
       for a stage, 20 for the name at the centre. -->
  <circle cx="550" cy="330" r="250" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="2"/>
  <!-- 2πr = 1571, and the house dash travels 246 units a second, so the
       lap takes 6.4s. Speed is distance per second, not cycle length. -->
  <circle class="cc-orbit" cx="550" cy="330" r="250" fill="none" stroke="#ea0000" stroke-opacity=".7"
          stroke-width="2" style="--len:1571; animation-duration:6.4s"/>

  <!-- direction, stated once per arc so the loop reads clockwise. They sit
       midway between two stops, where the discs leave the arc clear. -->
  <g fill="#ea0000" fill-opacity=".8">
    <path d="M-9 -7 L9 0 L-9 7 z" transform="translate(675 113.5) rotate(30)"/>
    <path d="M-9 -7 L9 0 L-9 7 z" transform="translate(800 330) rotate(90)"/>
    <path d="M-9 -7 L9 0 L-9 7 z" transform="translate(675 546.5) rotate(150)"/>
    <path d="M-9 -7 L9 0 L-9 7 z" transform="translate(425 546.5) rotate(210)"/>
    <path d="M-9 -7 L9 0 L-9 7 z" transform="translate(300 330) rotate(270)"/>
    <path d="M-9 -7 L9 0 L-9 7 z" transform="translate(425 113.5) rotate(330)"/>
  </g>

  <!-- The clinic the loop runs inside. Larger than the stops, because it
       is the thing they all belong to rather than one more of them.

       The centre band ends at y402 and the discs at 3 and 5 start at y411.
       Placed by eye against the ring instead, the second line runs into
       their row. -->
  <g class="cc-in" style="--d:.05s">
    <circle cx="550" cy="282" r="52" fill="#e7e3e1" stroke="rgba(248,244,242,.28)"/>
    <image href="/assets/CaseChat/icons/clinic.png" x="518" y="250" width="64" height="64"/>
  </g>
  <text class="cc-in" style="--d:.05s" x="550" y="374" font-size="20" text-anchor="middle" fill="#ea0000">VIRTUAL CLINIC</text>
  <text class="cc-in" style="--d:.05s" x="550" y="397" font-size="15" text-anchor="middle" fill="currentColor" opacity=".5">unlimited patients</text>

  <!-- The six stops. Disc, mark and label move together, so a stage
       arrives as one thing rather than three that happen to line up. -->
  <g font-size="15" fill="currentColor">
    <g class="cc-in" style="--d:.15s">
      <circle cx="550" cy="80" r="44" fill="#e7e3e1" stroke="rgba(248,244,242,.28)"/>
      <image href="/assets/CaseChat/icons/Patient.png" x="522.5" y="52.5" width="55" height="55"/>
      <text x="550" y="22" text-anchor="middle" opacity=".8">1 · PICK A PATIENT</text>
    </g>

    <g class="cc-in" style="--d:.25s">
      <circle cx="766.5" cy="205" r="44" fill="#e7e3e1" stroke="rgba(248,244,242,.28)"/>
      <image href="/assets/CaseChat/icons/patient-history.png" x="739" y="177.5" width="55" height="55"/>
      <text x="825" y="211" opacity=".8">2 · TAKE HISTORY</text>
    </g>

    <g class="cc-in" style="--d:.35s">
      <circle cx="766.5" cy="455" r="44" fill="#e7e3e1" stroke="rgba(248,244,242,.28)"/>
      <image href="/assets/CaseChat/icons/test.png" x="739" y="427.5" width="55" height="55"/>
      <text x="825" y="461" opacity=".8">3 · ORDER TESTS</text>
    </g>

    <g class="cc-in" style="--d:.45s">
      <circle cx="550" cy="580" r="44" fill="#e7e3e1" stroke="rgba(248,244,242,.28)"/>
      <image href="/assets/CaseChat/icons/diagnosis.png" x="522.5" y="552.5" width="55" height="55"/>
      <text x="550" y="648" text-anchor="middle" opacity=".8">4 · DIAGNOSE</text>
    </g>

    <g class="cc-in" style="--d:.55s">
      <circle cx="333.5" cy="455" r="44" fill="#e7e3e1" stroke="rgba(248,244,242,.28)"/>
      <image href="/assets/CaseChat/icons/treatment.png" x="306" y="427.5" width="55" height="55"/>
      <text x="275" y="461" text-anchor="end" opacity=".8">5 · TREAT</text>
    </g>

    <g class="cc-in" style="--d:.65s">
      <circle cx="333.5" cy="205" r="44" fill="#e7e3e1" stroke="rgba(248,244,242,.28)"/>
      <image href="/assets/CaseChat/icons/Feedback.png" x="306" y="177.5" width="55" height="55"/>
      <text x="275" y="211" text-anchor="end" opacity=".8">6 · FEEDBACK</text>
    </g>
  </g>

  <!-- the closing edge, named. It sits clear of the ring with a leader
       rather than crowding the arc it annotates. -->
  <g class="cc-in" style="--d:1s" fill="#ea0000">
    <text x="330" y="92" font-size="15" text-anchor="end">and again —</text>
    <text x="330" y="114" font-size="15" text-anchor="end">a new patient</text>
    <line x1="338" y1="106" x2="404" y2="118" stroke="#ea0000" stroke-opacity=".55" stroke-width="1.5"/>
  </g>
</svg>
