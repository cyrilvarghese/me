<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img"
     aria-label="One patient case, carrying history, tests, diagnosis and treatment, is the single object a teacher explains through and a student practises on.">
  <defs>
    <marker id="ccA-01c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" opacity=".5"/>
    </marker>
    <marker id="ccR-01c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea0000"/>
    </marker>
  </defs>

  <rect x="40" y="26" width="140" height="44" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".22"/>
  <text x="110" y="53" font-size="15" text-anchor="middle" fill="currentColor" opacity=".85">TEACHER</text>

  <rect x="380" y="26" width="140" height="44" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".22"/>
  <text x="450" y="53" font-size="15" text-anchor="middle" fill="currentColor" opacity=".85">STUDENT</text>

  <!-- Both sides reach the same object. That is the whole claim: a case
       is not a teaching aid on one side and an exercise on the other, it
       is one artefact used twice. -->
  <line class="cc-draw" style="--len:134;--d:.2s" x1="110" y1="74" x2="215" y2="150" stroke="currentColor" stroke-opacity=".38" marker-end="url(#ccA-01c)"/>
  <line class="cc-draw" style="--len:134;--d:.35s" x1="450" y1="74" x2="345" y2="150" stroke="currentColor" stroke-opacity=".38" marker-end="url(#ccA-01c)"/>

  <text class="cc-in" style="--d:.8s" x="56" y="128" font-size="12" fill="currentColor" opacity=".55">teaches through</text>
  <text class="cc-in" style="--d:.9s" x="504" y="128" font-size="12" text-anchor="end" fill="currentColor" opacity=".55">practises on</text>

  <rect x="40" y="158" width="480" height="132" fill="#ea0000" fill-opacity=".05" stroke="#ea0000" stroke-opacity=".55"/>
  <text x="280" y="186" font-size="15" text-anchor="middle" fill="#ea0000">PATIENT CASE</text>

  <!-- The four stages are what makes the case a whole episode of care
       rather than a question with an answer. -->
  <rect x="60" y="206" width="92" height="40" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-opacity=".2"/>
  <text x="106" y="231" font-size="12" text-anchor="middle" fill="currentColor" opacity=".8">HISTORY</text>

  <rect x="176" y="206" width="92" height="40" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-opacity=".2"/>
  <text x="222" y="231" font-size="12" text-anchor="middle" fill="currentColor" opacity=".8">TESTS</text>

  <rect x="292" y="206" width="92" height="40" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-opacity=".2"/>
  <text x="338" y="231" font-size="12" text-anchor="middle" fill="currentColor" opacity=".8">DIAGNOSIS</text>

  <rect x="408" y="206" width="92" height="40" fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-opacity=".2"/>
  <text x="454" y="231" font-size="12" text-anchor="middle" fill="currentColor" opacity=".8">TREATMENT</text>

  <line class="cc-draw" style="--len:24;--d:1s" x1="152" y1="226" x2="172" y2="226" stroke="#ea0000" stroke-opacity=".7" marker-end="url(#ccR-01c)"/>
  <line class="cc-draw" style="--len:24;--d:1.15s" x1="268" y1="226" x2="288" y2="226" stroke="#ea0000" stroke-opacity=".7" marker-end="url(#ccR-01c)"/>
  <line class="cc-draw" style="--len:24;--d:1.3s" x1="384" y1="226" x2="404" y2="226" stroke="#ea0000" stroke-opacity=".7" marker-end="url(#ccR-01c)"/>

  <text x="280" y="273" font-size="12" text-anchor="middle" fill="currentColor" opacity=".5">generated on demand — a new one whenever it is wanted</text>
</svg>
