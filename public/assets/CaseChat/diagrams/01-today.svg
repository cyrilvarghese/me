<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img"
     aria-label="A student's learning time split three ways; only the fifth spent at the bedside feeds the ability to work a patient.">
  <defs>
    <marker id="ccA-01t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" opacity=".5"/>
    </marker>
    <marker id="ccR-01t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea0000"/>
    </marker>
  </defs>

  <!-- One bar, one hundred percent of a student's time. The segments are
       drawn to scale, so the argument is in the geometry rather than in
       the number printed above it. -->
  <text x="142" y="28" font-size="17" text-anchor="middle" fill="currentColor" opacity=".55">45%</text>
  <text x="342" y="28" font-size="17" text-anchor="middle" fill="currentColor" opacity=".55">35%</text>
  <text x="480" y="28" font-size="17" text-anchor="middle" fill="#ea0000">20%</text>

  <rect x="30" y="40" width="225" height="38" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".22"/>
  <rect x="255" y="40" width="175" height="38" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-opacity=".22"/>
  <rect x="430" y="40" width="100" height="38" fill="#ea0000" fill-opacity=".14" stroke="#ea0000" stroke-opacity=".65"/>

  <text x="142" y="64" font-size="14" text-anchor="middle" fill="currentColor" opacity=".85">LECTURES</text>
  <text x="342" y="64" font-size="14" text-anchor="middle" fill="currentColor" opacity=".85">BOOKS</text>
  <text x="480" y="64" font-size="14" text-anchor="middle" fill="#ea0000">BEDSIDE</text>

  <text x="142" y="99" font-size="12" text-anchor="middle" fill="currentColor" opacity=".5">150 to a room</text>
  <text x="342" y="99" font-size="12" text-anchor="middle" fill="currentColor" opacity=".5">dense textbooks</text>
  <text x="480" y="99" font-size="12" text-anchor="middle" fill="currentColor" opacity=".5">real patients</text>

  <!-- Two theory paths and one practice path, landing on two different
       competencies. The split is the point: the box on the right is the
       one the job needs, and only the narrow segment feeds it. -->
  <line class="cc-draw" style="--len:136;--d:.15s" x1="142" y1="116" x2="130" y2="242" stroke="currentColor" stroke-opacity=".38" marker-end="url(#ccA-01t)"/>
  <line class="cc-draw" style="--len:186;--d:.3s" x1="342" y1="116" x2="220" y2="242" stroke="currentColor" stroke-opacity=".38" marker-end="url(#ccA-01t)"/>
  <line class="cc-draw" style="--len:140;--d:.45s" x1="480" y1="116" x2="450" y2="242" stroke="#ea0000" stroke-opacity=".8" marker-end="url(#ccR-01t)"/>

  <text class="cc-in" style="--d:.9s" x="150" y="186" font-size="12" fill="currentColor" opacity=".5">theory</text>
  <text class="cc-in" style="--d:1s" x="298" y="186" font-size="12" fill="currentColor" opacity=".5">theory</text>
  <text class="cc-in" style="--d:1.1s" x="492" y="186" font-size="12" fill="#ea0000">practice</text>

  <rect x="30" y="248" width="280" height="58" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".22"/>
  <text x="170" y="273" font-size="15" text-anchor="middle" fill="currentColor" opacity=".85">KNOWS THE FACTS</text>
  <text x="170" y="292" font-size="12" text-anchor="middle" fill="currentColor" opacity=".45">recall and recognition</text>

  <rect x="340" y="248" width="190" height="58" fill="#ea0000" fill-opacity=".07" stroke="#ea0000" stroke-opacity=".55"/>
  <text x="435" y="273" font-size="15" text-anchor="middle" fill="#ea0000">WORKS A PATIENT</text>
  <text x="435" y="292" font-size="12" text-anchor="middle" fill="currentColor" opacity=".45">decides, then learns</text>
</svg>
