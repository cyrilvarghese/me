<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 396" role="img"
     aria-label="Engagement plotted against effectiveness: the line the product started on, and the steeper one it ended on, alongside the three versions that moved it.">
  <defs>
    <marker id="ccA-03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" opacity=".4"/>
    </marker>
    <marker id="ccR-03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea0000"/>
    </marker>
  </defs>

  <!-- Two rays from the same origin. Nothing was traded: the second is
       steeper on both axes at once, which is the finding. -->
  <line x1="110" y1="330" x2="110" y2="56" stroke="currentColor" stroke-opacity=".3" marker-end="url(#ccA-03)"/>
  <line x1="110" y1="330" x2="566" y2="330" stroke="currentColor" stroke-opacity=".3" marker-end="url(#ccA-03)"/>
  <text x="122" y="48" font-size="12" fill="currentColor" opacity=".5">ENGAGEMENT</text>
  <text x="566" y="354" font-size="12" text-anchor="end" fill="currentColor" opacity=".5">EFFECTIVENESS</text>

  <line class="cc-in" style="--d:.3s" x1="110" y1="330" x2="520" y2="225" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="5 6" marker-end="url(#ccA-03)"/>
  <text class="cc-in" style="--d:.5s" x="336" y="294" font-size="12" fill="currentColor" opacity=".5">where we started</text>

  <line class="cc-draw" style="--len:470;--d:.5s" x1="110" y1="330" x2="520" y2="110" stroke="#ea0000" stroke-opacity=".85" marker-end="url(#ccR-03)"/>
  <text class="cc-in" style="--d:1.2s" x="424" y="92" font-size="14" fill="#ea0000">where we ended up</text>

  <line x1="630" y1="50" x2="630" y2="380" stroke="currentColor" stroke-opacity=".12"/>

  <!-- What actually moved it, in the order it shipped. -->
  <text x="680" y="62" font-size="12" fill="currentColor" opacity=".5">WHAT CHANGED</text>

  <line class="cc-draw" style="--len:88;--d:.4s" x1="704" y1="136" x2="704" y2="219" stroke="currentColor" stroke-opacity=".3"/>
  <line class="cc-draw" style="--len:88;--d:.7s" x1="704" y1="231" x2="704" y2="314" stroke="#ea0000" stroke-opacity=".6"/>

  <circle class="cc-in" style="--d:.2s" cx="704" cy="130" r="6" fill="currentColor" fill-opacity=".4"/>
  <circle class="cc-in" style="--d:.5s" cx="704" cy="225" r="6" fill="currentColor" fill-opacity=".7"/>
  <circle class="cc-beat" style="--d:1.2s" cx="704" cy="320" r="6" fill="#ea0000"/>

  <text class="cc-in" style="--d:.2s" x="732" y="134" font-size="15" fill="currentColor" opacity=".8">V1</text>
  <text class="cc-in" style="--d:.2s" x="784" y="134" font-size="12" fill="currentColor" opacity=".55">case practice with feedback</text>

  <text class="cc-in" style="--d:.5s" x="732" y="229" font-size="15" fill="currentColor" opacity=".8">V2</text>
  <text class="cc-in" style="--d:.5s" x="784" y="229" font-size="12" fill="currentColor" opacity=".55">concept overlays inside the case</text>

  <text class="cc-in" style="--d:.9s" x="732" y="324" font-size="15" fill="#ea0000">V3</text>
  <text class="cc-in" style="--d:.9s" x="784" y="324" font-size="12" fill="#ea0000" opacity=".8">exam-shaped assessments</text>
</svg>
