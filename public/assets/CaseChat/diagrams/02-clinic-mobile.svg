<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 770" role="img"
     aria-label="Six stages of care — pick a patient, take history, order tests, diagnose, treat, read the feedback — running down a column and returning from the last to the first, with a new patient every time round.">
  <!-- The phone telling of the ring.

       A circle needs width on two axes and has neither here, so the axis
       rotates: the six stops run down a column, and the edge that closes
       them comes back up the left. That edge is the whole argument, so it
       is the one thing that survives the change of arrangement intact —
       dropping it would leave a list of six stages, which is what the ring
       existed to not be.

       The route is one closed path, same as the ring: 1412 units, and the
       house dash travels 246 a second, so the lap takes 5.74s.

       Type returns to the ladder at this width: 15 for a stage, 20 for the
       name of the thing they belong to. -->
  <defs>
    <!-- its own id: this file and the wide one are both inlined into the
         same document, and a shared id would leave one of them pointing at
         the other's definition -->
    <radialGradient id="ccGlowCol">
      <stop offset="0%" stop-color="#f8f4f2" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#f8f4f2" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#f8f4f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="none">
    <path d="M64 66 L64 690 Q64 704 50 704 L34 704 Q20 704 20 690 L20 44 Q20 30 34 30 L50 30 Q64 30 64 44 L64 66"
          stroke="#f8f4f2" stroke-opacity=".28" stroke-width="2.1"
          stroke-linecap="round" stroke-dasharray="1.4 9.8"/>

    <path class="cc-trail" pathLength="100"
          d="M64 66 L64 690 Q64 704 50 704 L34 704 Q20 704 20 690 L20 44 Q20 30 34 30 L50 30 Q64 30 64 44 L64 66"
          stroke="#eee8e6" stroke-width="1.84" stroke-linecap="round"
          style="--dur:5.74s"/>

    <path class="cc-run"
          d="M64 66 L64 690 Q64 704 50 704 L34 704 Q20 704 20 690 L20 44 Q20 30 34 30 L50 30 Q64 30 64 44 L64 66"
          stroke="#ea0000" stroke-width="2.6" stroke-linecap="round"
          style="--len:1412; --dash:7.35; --dur:5.74s"/>
  </g>

  <!-- The clinic the loop runs inside, named at the foot of the column
       rather than in a middle it no longer has. -->
  <text class="cc-in" style="--d:.05s" x="110" y="712" font-size="20" fill="#ea0000">VIRTUAL CLINIC</text>
  <text class="cc-in" style="--d:.05s" x="110" y="736" font-size="15" fill="currentColor" opacity=".5">unlimited patients</text>

  <!-- the closing edge is named where it arrives rather than where it
       leaves, which is the only place in a column with room for the words -->
  <text class="cc-in" style="--d:1s" x="110" y="22" font-size="15" fill="#ea0000">and again — a new patient</text>

  <!-- The six stops. Each ping's --d is that stop's distance along the
       route as a share of the lap, so it fires as the runner reaches it —
       the stops are evenly spaced, the return is not, so these are not a
       sixth apart the way the ring's are. -->
  <g font-size="15" fill="currentColor">
    <g class="cc-in" style="--d:.15s">
      <circle class="cc-ping" cx="64" cy="66" r="20" fill="none" stroke="#ea0000" stroke-width="1.6" style="--dur:5.74s; --d:0s"/>
      <circle cx="64" cy="66" r="35" fill="url(#ccGlowCol)"/>
      <image href="/assets/CaseChat/icons/Patient.png" x="45.5" y="47.5" width="37" height="37"/>
      <text x="110" y="71" opacity=".8">1 · PICK A PATIENT</text>
    </g>

    <g class="cc-in" style="--d:.25s">
      <circle class="cc-ping" cx="64" cy="186" r="20" fill="none" stroke="#ea0000" stroke-width="1.6" style="--dur:5.74s; --d:.488s"/>
      <circle cx="64" cy="186" r="35" fill="url(#ccGlowCol)"/>
      <image href="/assets/CaseChat/icons/patient-history.png" x="45.5" y="167.5" width="37" height="37"/>
      <text x="110" y="191" opacity=".8">2 · TAKE HISTORY</text>
    </g>

    <g class="cc-in" style="--d:.35s">
      <circle class="cc-ping" cx="64" cy="306" r="20" fill="none" stroke="#ea0000" stroke-width="1.6" style="--dur:5.74s; --d:.976s"/>
      <circle cx="64" cy="306" r="35" fill="url(#ccGlowCol)"/>
      <image href="/assets/CaseChat/icons/test.png" x="45.5" y="287.5" width="37" height="37"/>
      <text x="110" y="311" opacity=".8">3 · ORDER TESTS</text>
    </g>

    <g class="cc-in" style="--d:.45s">
      <circle class="cc-ping" cx="64" cy="426" r="20" fill="none" stroke="#ea0000" stroke-width="1.6" style="--dur:5.74s; --d:1.463s"/>
      <circle cx="64" cy="426" r="35" fill="url(#ccGlowCol)"/>
      <image href="/assets/CaseChat/icons/diagnosis.png" x="45.5" y="407.5" width="37" height="37"/>
      <text x="110" y="431" opacity=".8">4 · DIAGNOSE</text>
    </g>

    <g class="cc-in" style="--d:.55s">
      <circle class="cc-ping" cx="64" cy="546" r="20" fill="none" stroke="#ea0000" stroke-width="1.6" style="--dur:5.74s; --d:1.951s"/>
      <circle cx="64" cy="546" r="35" fill="url(#ccGlowCol)"/>
      <image href="/assets/CaseChat/icons/treatment.png" x="45.5" y="527.5" width="37" height="37"/>
      <text x="110" y="551" opacity=".8">5 · TREAT</text>
    </g>

    <g class="cc-in" style="--d:.65s">
      <circle class="cc-ping" cx="64" cy="666" r="20" fill="none" stroke="#ea0000" stroke-width="1.6" style="--dur:5.74s; --d:2.439s"/>
      <circle cx="64" cy="666" r="35" fill="url(#ccGlowCol)"/>
      <image href="/assets/CaseChat/icons/Feedback.png" x="45.5" y="647.5" width="37" height="37"/>
      <text x="110" y="671" opacity=".8">6 · FEEDBACK</text>
    </g>
  </g>
</svg>
