<svg viewBox="0 0 360 250" role="img"
     aria-label="Script to prompt to image at single cost, then a fan into four videos, each costing four times as much to fix.">
  <!-- steps, then a fan. The mistake is cheap while the line is still a
       line; the moment it branches into video it is paid for four times,
       and the end nodes carry four times the area to say so. -->
  <g fill="none" stroke="#ea0000" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round">
    <path d="M32,185 L112,176 L190,166"/>
    <path d="M190,166 C235,166 245,70 292,55"/>
    <path d="M190,166 C235,166 250,112 296,105"/>
    <path d="M190,166 L298,158"/>
    <path d="M190,166 C235,166 245,196 286,208"/>
  </g>

  <g fill="#ea0000">
    <circle cx="32" cy="185" r="6"/>
    <circle cx="112" cy="176" r="6"/>
    <circle cx="190" cy="166" r="6"/>
  </g>
  <g fill="#ea0000">
    <circle cx="292" cy="55" r="12"/>
    <circle cx="296" cy="105" r="12"/>
    <circle cx="298" cy="158" r="12"/>
    <circle cx="286" cy="208" r="12"/>
  </g>

  <g font-size="13" fill="currentColor" opacity=".55">
    <text x="32" y="167" text-anchor="middle">script</text>
    <text x="112" y="158" text-anchor="middle">prompt</text>
    <text x="190" y="148" text-anchor="middle">image</text>
  </g>
  <g font-size="13" fill="#ea0000">
    <text x="190" y="196" text-anchor="middle">1&#215;</text>
    <text x="314" y="60">4&#215;</text>
    <text x="318" y="110">4&#215;</text>
    <text x="320" y="163">4&#215;</text>
    <text x="308" y="213">4&#215;</text>
  </g>
</svg>
