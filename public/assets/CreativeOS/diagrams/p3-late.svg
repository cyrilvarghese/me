<svg viewBox="0 0 360 240" role="img"
     aria-label="A mistake made at a small early step and found at a step four times its size.">
  <!-- the cost is the size: r doubles, so the node where the mistake is
       found covers four times the area of the one that made it -->
  <line x1="70" y1="120" x2="270" y2="120"
        stroke="#ea0000" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="120" r="6" fill="#ea0000"/>
  <circle cx="270" cy="120" r="12" fill="#ea0000"/>
</svg>
