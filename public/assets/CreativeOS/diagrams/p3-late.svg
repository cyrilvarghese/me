<svg viewBox="0 0 360 240" role="img"
     aria-label="A mistake made at a small early step and found at a step four times its size.">
  <!-- one run, two ends. Size carries the cost: the node where the
       mistake is found is four times the area of the one that made it. -->
  <line x1="60" y1="120" x2="280" y2="120"
        stroke="#ea0000" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="120" r="8" fill="#ea0000"/>
  <circle cx="280" cy="120" r="32" fill="none" stroke="#ea0000" stroke-width="2.5"/>
  <circle cx="280" cy="120" r="8" fill="#ea0000"/>
</svg>
