<svg viewBox="0 0 1080 300" role="img"
     aria-label="One canvas: a single setup and a review inside one boundary, feeding three reels in parallel.">
  <!-- the same nodes and lines as the problems, gathered inside one
       boundary — which is the whole answer, drawn -->
  <rect x="40" y="40" width="700" height="220" rx="10"
        fill="none" stroke="#ea0000" stroke-width="2.5" stroke-opacity=".45"/>

  <g stroke="#ea0000" stroke-width="2.5" stroke-linecap="round">
    <line x1="110" y1="150" x2="640" y2="150"/>
    <path d="M640,150 C760,150 800,70 900,70" fill="none"/>
    <line x1="640" y1="150" x2="900" y2="150"/>
    <path d="M640,150 C760,150 800,230 900,230" fill="none"/>
  </g>

  <g fill="#ea0000">
    <circle cx="110" cy="150" r="6"/>
    <circle cx="240" cy="150" r="6"/>
    <circle cx="370" cy="150" r="6"/>
    <circle cx="500" cy="150" r="6"/>
    <circle cx="900" cy="70" r="6"/>
    <circle cx="900" cy="150" r="6"/>
    <circle cx="900" cy="230" r="6"/>
  </g>
  <circle cx="640" cy="150" r="14" fill="none" stroke="#ea0000" stroke-width="2.5"/>
</svg>
