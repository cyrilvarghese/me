<svg viewBox="0 0 360 250" role="img"
     aria-label="The work crosses and re-crosses five tools — ChatGPT, Gemini, Kling, Canva and Open art — tracing a star rather than a line.">
  <!-- the star from 02-today, which is the shape of the problem: the
       work never advances, it keeps cutting back across the same five
       tools. Every second point joined, as a pentagram. -->
  <path d="M180,38 L228,186 L102,95 L258,95 L132,186 Z"
        fill="none" stroke="#ea0000" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ea0000">
    <circle cx="180" cy="38" r="6"/>
    <circle cx="258" cy="95" r="6"/>
    <circle cx="228" cy="186" r="6"/>
    <circle cx="132" cy="186" r="6"/>
    <circle cx="102" cy="95" r="6"/>
  </g>
  <g font-size="13" fill="currentColor" opacity=".55">
    <text x="180" y="24" text-anchor="middle">ChatGPT</text>
    <text x="272" y="92">Gemini</text>
    <text x="240" y="212" text-anchor="middle">Kling</text>
    <text x="120" y="212" text-anchor="middle">Canva</text>
    <text x="88" y="92" text-anchor="end">Open art</text>
  </g>
</svg>
