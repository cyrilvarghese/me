<svg viewBox="0 0 360 240" role="img"
     aria-label="Five separate tools, each with a link that leads nowhere: nothing joins the work from one to the next.">
  <!-- five tools and no joins. The stubs matter more than the boxes:
       each one leaves its tool and stops in open ground, which is what
       "disconnected" looks like without a single X to say it. -->
  <g fill="none" stroke="#ea0000" stroke-width="3"
     stroke-linecap="round" stroke-dasharray="2 12">
    <line x1="118" y1="70" x2="152" y2="70"/>
    <line x1="252" y1="70" x2="286" y2="70"/>
    <line x1="118" y1="170" x2="152" y2="170"/>
    <line x1="186" y1="104" x2="186" y2="136"/>
  </g>

  <g fill="#1e1818" stroke="#eee8e6" stroke-width="2.5">
    <rect x="44" y="48" width="70" height="44" rx="5"/>
    <rect x="156" y="48" width="70" height="44" rx="5"/>
    <rect x="268" y="48" width="70" height="44" rx="5"/>
    <rect x="44" y="148" width="70" height="44" rx="5"/>
    <rect x="156" y="148" width="70" height="44" rx="5"/>
  </g>
</svg>
