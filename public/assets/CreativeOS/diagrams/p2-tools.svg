<svg viewBox="0 0 360 250" role="img"
     aria-label="Five separate tools — ChatGPT, Gemini, Kling, Canva and Open art — with nothing joining one to the next.">
  <!-- the five tools 02-today names, kept as names: what makes this read
       as five tools rather than five dots is that each one is somewhere
       real. Nothing connects them, which is the point. -->
  <g stroke="#ea0000" stroke-width="2.5" stroke-linecap="round">
    <line x1="42" y1="60" x2="88" y2="60"/>
    <line x1="157" y1="60" x2="203" y2="60"/>
    <line x1="272" y1="60" x2="318" y2="60"/>
    <line x1="99" y1="160" x2="145" y2="160"/>
    <line x1="215" y1="160" x2="261" y2="160"/>
  </g>
  <g fill="#ea0000">
    <circle cx="42" cy="60" r="6"/>
    <circle cx="157" cy="60" r="6"/>
    <circle cx="272" cy="60" r="6"/>
    <circle cx="99" cy="160" r="6"/>
    <circle cx="215" cy="160" r="6"/>
  </g>
  <g font-size="14" fill="currentColor" opacity=".55">
    <text x="42" y="92">ChatGPT</text>
    <text x="157" y="92">Gemini</text>
    <text x="272" y="92">Kling</text>
    <text x="99" y="192">Canva</text>
    <text x="215" y="192">Open art</text>
  </g>
</svg>
