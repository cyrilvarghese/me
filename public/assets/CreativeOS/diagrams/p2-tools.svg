<svg viewBox="0 0 360 240" role="img"
     aria-label="Five tools, three above and two below, each with a link that stops in open ground instead of reaching the next.">
  <!-- five of the same mark, evenly placed, none of them joined: what
       the drawing lacks is what the tools lack -->
  <g stroke="#ea0000" stroke-width="2.5" stroke-linecap="round">
    <line x1="40" y1="90" x2="100" y2="90"/>
    <line x1="150" y1="90" x2="210" y2="90"/>
    <line x1="260" y1="90" x2="320" y2="90"/>
    <line x1="95" y1="170" x2="155" y2="170"/>
    <line x1="205" y1="170" x2="265" y2="170"/>
  </g>
  <g fill="#ea0000">
    <circle cx="40" cy="90" r="6"/>
    <circle cx="150" cy="90" r="6"/>
    <circle cx="260" cy="90" r="6"/>
    <circle cx="95" cy="170" r="6"/>
    <circle cx="205" cy="170" r="6"/>
  </g>
</svg>
