<svg viewBox="0 0 360 240" role="img"
     aria-label="Five tools, each with a link that runs out into open ground rather than reaching the next one.">
  <!-- five nodes, no joins. Every line leaves a tool and stops in the
       open: the gaps are the drawing. -->
  <g stroke="#ea0000" stroke-width="2.5" stroke-linecap="round">
    <line x1="52" y1="72" x2="112" y2="72"/>
    <line x1="176" y1="72" x2="236" y2="72"/>
    <line x1="308" y1="72" x2="308" y2="128"/>
    <line x1="96" y1="176" x2="156" y2="176"/>
    <line x1="220" y1="176" x2="280" y2="176"/>
  </g>
  <g fill="#ea0000">
    <circle cx="52" cy="72" r="6"/>
    <circle cx="176" cy="72" r="6"/>
    <circle cx="308" cy="72" r="6"/>
    <circle cx="96" cy="176" r="6"/>
    <circle cx="220" cy="176" r="6"/>
  </g>
</svg>
