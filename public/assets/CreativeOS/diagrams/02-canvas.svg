<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Same technique as the deck's other diagrams: a short dash runs the
       path while a second copy of the path fills in behind it. The loop
       is 968 units around (320+164+320+164), so the runner travels
       exactly that far in one cycle and the fill tracks it. */
    @keyframes cosCanvasRun {
      0%       { stroke-dashoffset: 0; opacity: 1; }
      90%      { stroke-dashoffset: -968; opacity: 1; }
      90.5%    { opacity: 0; }
      100%     { stroke-dashoffset: -968; opacity: 0; }
    }
    @keyframes cosCanvasFill {
      0%       { stroke-dashoffset: 100; opacity: 0.9; }
      90%      { stroke-dashoffset: 0; opacity: 0.9; }
      100%     { stroke-dashoffset: 0; opacity: 0; }
    }
    .cosCanvasRunner { animation: cosCanvasRun 9s linear infinite; }
    .cosCanvasFill   { animation: cosCanvasFill 9s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cosCanvasRunner,
      .cosCanvasFill { animation: none; stroke-dashoffset: 0; opacity: 0.9; }
    }
  </style>

  <!-- the canvas everything lives on -->
  <rect x="46" y="36" width="708" height="400" rx="26" fill="none"
        stroke="rgba(248,244,242,0.22)" stroke-width="2"
        stroke-dasharray="2 10" stroke-linecap="round" />
  <text x="84" y="78" style="font-size:17px;letter-spacing:3.9px" fill="#9e9493">CREATIVEOS</text>

  <!-- the run, dotted until the work reaches it -->
  <path d="M240,170 H560 V334 H240 Z" fill="none"
        stroke="rgba(248,244,242,0.24)" stroke-width="2.5"
        stroke-dasharray="2 14" stroke-linecap="round" />

  <!-- filled behind the runner -->
  <path class="cosCanvasFill" d="M240,170 H560 V334 H240 Z" pathLength="100" fill="none"
        stroke="#eee8e6" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="100 100" stroke-dashoffset="100" />

  <!-- the work itself, moving -->
  <path class="cosCanvasRunner" d="M240,170 H560 V334 H240 Z" fill="none"
        stroke="#ea0000" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="16 952" />

  <!-- nodes -->
  <g fill="#1e1818" stroke="rgba(248,244,242,0.42)" stroke-width="2.5">
    <circle cx="240" cy="170" r="30" />
    <circle cx="560" cy="170" r="30" />
    <circle cx="560" cy="334" r="30" />
    <circle cx="240" cy="334" r="30" />
  </g>
  <g fill="#eee8e6">
    <circle cx="240" cy="170" r="6" />
    <circle cx="560" cy="170" r="6" />
    <circle cx="560" cy="334" r="6" />
    <circle cx="240" cy="334" r="6" />
  </g>

  <g text-anchor="middle" style="font-size:19px" fill="#eee8e6">
    <text x="240" y="122">Script</text>
    <text x="560" y="122">Images</text>
    <text x="560" y="392">Video</text>
    <text x="240" y="392">Review</text>
  </g>
</svg>
