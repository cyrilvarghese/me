<svg viewBox="126 92 548 322" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Same technique as the deck's other diagrams: a marker runs the path
       while a second copy of the path fills in behind it. The loop is 968
       units around (320+164+320+164); at section 01's speed (246 units a
       second) that is 3.93s, so travel takes 49.15% of the 8s cycle and
       the rest is the hold. The marker is a zero-length dash with a round
       cap — a dot that rides the line exactly as the fill does. */
    @keyframes cosCanvasRun {
      0%       { stroke-dashoffset: 0; opacity: 1; }
      49.15%   { stroke-dashoffset: -968; opacity: 1; }
      49.65%   { opacity: 0; }
      100%     { stroke-dashoffset: -968; opacity: 0; }
    }
    @keyframes cosCanvasFill {
      0%       { stroke-dashoffset: 100; opacity: 0.9; }
      49.15%   { stroke-dashoffset: 0; opacity: 0.9; }
      100%     { stroke-dashoffset: 0; opacity: 0; }
    }
    .cosCanvasRunner { animation: cosCanvasRun 8s linear infinite; }
    .cosCanvasFill   { animation: cosCanvasFill 8s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cosCanvasRunner,
      .cosCanvasFill { animation: none; stroke-dashoffset: 0; opacity: 0.9; }
    }
  </style>

  <!-- the run, dotted until the work reaches it -->
  <path d="M240,170 H560 V334 H240 Z" fill="none"
        stroke="rgba(248,244,242,0.24)" stroke-width="2.06"
        stroke-dasharray="2 14" stroke-linecap="round" />

  <!-- filled in behind the runner -->
  <path class="cosCanvasFill" d="M240,170 H560 V334 H240 Z" pathLength="100" fill="none"
        stroke="#eee8e6" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="100 100" stroke-dashoffset="100" />

  <!-- the work itself, moving: a round cap on a zero-length dash -->
  <path class="cosCanvasRunner" d="M240,170 H560 V334 H240 Z" fill="none"
        stroke="#ea0000" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="0.01 967.99" />

  <!-- nodes: the shared three-layer treatment (halo / ring / centre),
       sized off this file's viewBox so they paint the same as every other
       diagram — 0.05, 0.0325 and 0.01 of the viewBox width -->
  <g fill="#1e1818" stroke="rgba(248,244,242,0.14)" stroke-width="1.37">
    <circle cx="240" cy="170" r="27.4" />
    <circle cx="560" cy="170" r="27.4" />
    <circle cx="560" cy="334" r="27.4" />
    <circle cx="240" cy="334" r="27.4" />
  </g>
  <g fill="#eee8e622">
    <circle cx="240" cy="170" r="27.4" />
    <circle cx="560" cy="170" r="27.4" />
    <circle cx="560" cy="334" r="27.4" />
    <circle cx="240" cy="334" r="27.4" />
  </g>
  <g fill="#1e1818" stroke="#eee8e6" stroke-width="2.74">
    <circle cx="240" cy="170" r="17.8" />
    <circle cx="560" cy="170" r="17.8" />
    <circle cx="560" cy="334" r="17.8" />
    <circle cx="240" cy="334" r="17.8" />
  </g>
  <g fill="#eee8e6">
    <circle cx="240" cy="170" r="5.5" />
    <circle cx="560" cy="170" r="5.5" />
    <circle cx="560" cy="334" r="5.5" />
    <circle cx="240" cy="334" r="5.5" />
  </g>

  <g text-anchor="middle" style="font-size:13.7px" fill="#eee8e6">
    <text x="240" y="128">Script</text>
    <text x="560" y="128">Images</text>
    <text x="560" y="382">Video</text>
    <text x="240" y="382">Review</text>
  </g>
</svg>
