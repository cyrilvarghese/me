<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes cosCanvasTravel {
      from { offset-distance: 0%; }
      to   { offset-distance: 100%; }
    }
    @keyframes cosCanvasPulse {
      0%, 100% { opacity: .28; }
      50%      { opacity: .5; }
    }
    .cosDot {
      offset-path: path("M240,170 H560 V334 H240 Z");
      offset-rotate: 0deg;
      animation: cosCanvasTravel 9s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .cosDot { animation: none; offset-distance: 12%; }
      .cosBloomRing { animation: none; }
    }
  </style>

  <defs>
    <filter id="cosBloom" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <!-- the canvas everything lives on -->
  <rect x="46" y="36" width="708" height="400" rx="26" fill="none"
        stroke="rgba(248,244,242,0.22)" stroke-width="2"
        stroke-dasharray="2 10" stroke-linecap="round" />
  <text x="84" y="78" style="font-size:17px;letter-spacing:3.9px" fill="#9e9493">CREATIVEOS</text>

  <!-- one continuous run: script → images → video → review → back -->
  <path d="M240,170 H560 V334 H240 Z" fill="none"
        stroke="rgba(248,244,242,0.3)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- nodes -->
  <g fill="#1e1818" stroke="rgba(248,244,242,0.42)" stroke-width="2.5">
    <circle cx="240" cy="170" r="30" />
    <circle cx="560" cy="170" r="30" />
    <circle cx="560" cy="334" r="30" />
    <circle cx="240" cy="334" r="30" />
  </g>
  <g fill="#eee8e6">
    <circle cx="240" cy="170" r="6" />
    <circle cx="560" cy="170" r="6" />
    <circle cx="560" cy="334" r="6" />
    <circle cx="240" cy="334" r="6" />
  </g>

  <g text-anchor="middle" style="font-size:19px" fill="#eee8e6">
    <text x="240" y="122">Script</text>
    <text x="560" y="122">Images</text>
    <text x="560" y="392">Video</text>
    <text x="240" y="392">Review</text>
  </g>

  <!-- the work moving on the canvas, context intact -->
  <g class="cosDot">
    <circle r="13" fill="#ea0000" opacity="0.4" filter="url(#cosBloom)" />
    <circle r="5" fill="#ea0000" />
  </g>
</svg>
