<svg viewBox="0 0 360 250" role="img"
     aria-label="The setup runs, loops back to the start, and runs again — three times over, once per reel.">
  <!-- the serpentine from 01-today, kept because it is the argument: the
       line does not move on, it turns around and does the same four
       steps again. Three runs, three identical rows. -->
  <g fill="none" stroke="#ea0000" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round">
    <line x1="70" y1="50" x2="270" y2="50"/>
    <path d="M270,50 C312,50 312,90 270,90 H70 C28,90 28,130 70,130"/>
    <line x1="70" y1="130" x2="270" y2="130"/>
    <path d="M270,130 C312,130 312,170 270,170 H70 C28,170 28,210 70,210"/>
    <line x1="70" y1="210" x2="270" y2="210"/>
  </g>
  <g fill="#ea0000">
    <circle cx="70" cy="50" r="6"/><circle cx="137" cy="50" r="6"/><circle cx="204" cy="50" r="6"/><circle cx="270" cy="50" r="6"/>
    <circle cx="70" cy="130" r="6"/><circle cx="137" cy="130" r="6"/><circle cx="204" cy="130" r="6"/><circle cx="270" cy="130" r="6"/>
    <circle cx="70" cy="210" r="6"/><circle cx="137" cy="210" r="6"/><circle cx="204" cy="210" r="6"/><circle cx="270" cy="210" r="6"/>
  </g>
</svg>
