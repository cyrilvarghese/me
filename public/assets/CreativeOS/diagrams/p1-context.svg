<svg viewBox="0 0 360 240" role="img"
     aria-label="The same four-step setup run again in full for each of three reels.">
  <!-- three identical runs: four context steps, once per reel. The
       repetition is the argument, so the drawing is one shape thrice. -->
  <g stroke="#ea0000" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="70" x2="300" y2="70"/>
    <line x1="60" y1="120" x2="300" y2="120"/>
    <line x1="60" y1="170" x2="300" y2="170"/>
  </g>
  <g fill="#ea0000">
    <circle cx="60" cy="70" r="6"/><circle cx="140" cy="70" r="6"/><circle cx="220" cy="70" r="6"/><circle cx="300" cy="70" r="6"/>
    <circle cx="60" cy="120" r="6"/><circle cx="140" cy="120" r="6"/><circle cx="220" cy="120" r="6"/><circle cx="300" cy="120" r="6"/>
    <circle cx="60" cy="170" r="6"/><circle cx="140" cy="170" r="6"/><circle cx="220" cy="170" r="6"/><circle cx="300" cy="170" r="6"/>
  </g>
</svg>
