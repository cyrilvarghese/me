<svg viewBox="0 0 360 240" role="img"
     aria-label="The same four-step setup repeated in full for each of three reels.">
  <!-- three identical runs. Nodes and lines only: the repetition is the
       argument, so the drawing is one shape said three times. -->
  <g stroke="#ea0000" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="60" x2="310" y2="60"/>
    <line x1="50" y1="120" x2="310" y2="120"/>
    <line x1="50" y1="180" x2="310" y2="180"/>
  </g>
  <g fill="#ea0000">
    <circle cx="50" cy="60" r="6"/><circle cx="115" cy="60" r="6"/><circle cx="180" cy="60" r="6"/><circle cx="245" cy="60" r="6"/><circle cx="310" cy="60" r="6"/>
    <circle cx="50" cy="120" r="6"/><circle cx="115" cy="120" r="6"/><circle cx="180" cy="120" r="6"/><circle cx="245" cy="120" r="6"/><circle cx="310" cy="120" r="6"/>
    <circle cx="50" cy="180" r="6"/><circle cx="115" cy="180" r="6"/><circle cx="180" cy="180" r="6"/><circle cx="245" cy="180" r="6"/><circle cx="310" cy="180" r="6"/>
  </g>
</svg>
