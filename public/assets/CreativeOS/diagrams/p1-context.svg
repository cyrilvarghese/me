<svg viewBox="0 0 360 250" role="img"
     aria-label="The same four-step setup run in full for each of three reels: the line reaches a reel, turns back to the start, and does it again.">
  <!-- the serpentine from 01-today, with what it is for: each run ends
       at a reel, then the line turns around and sets the same four
       pieces of context again for the next one. Reels are hollow, the
       context steps solid — output against work. -->
  <g fill="none" stroke="#ea0000" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round">
    <line x1="55" y1="50" x2="258" y2="50"/>
    <path d="M258,50 C288,50 288,90 258,90 H55 C25,90 25,130 55,130"/>
    <line x1="55" y1="130" x2="258" y2="130"/>
    <path d="M258,130 C288,130 288,170 258,170 H55 C25,170 25,210 55,210"/>
    <line x1="55" y1="210" x2="258" y2="210"/>
  </g>

  <g fill="#ea0000">
    <circle cx="55" cy="50" r="6"/><circle cx="110" cy="50" r="6"/><circle cx="165" cy="50" r="6"/><circle cx="220" cy="50" r="6"/>
    <circle cx="55" cy="130" r="6"/><circle cx="110" cy="130" r="6"/><circle cx="165" cy="130" r="6"/><circle cx="220" cy="130" r="6"/>
    <circle cx="55" cy="210" r="6"/><circle cx="110" cy="210" r="6"/><circle cx="165" cy="210" r="6"/><circle cx="220" cy="210" r="6"/>
  </g>

  <g fill="none" stroke="#ea0000" stroke-width="2.5">
    <circle cx="258" cy="50" r="7"/>
    <circle cx="258" cy="130" r="7"/>
    <circle cx="258" cy="210" r="7"/>
  </g>

  <g font-size="13" fill="currentColor" opacity=".55">
    <text x="300" y="54">Reel 1</text>
    <text x="300" y="134">Reel 2</text>
    <text x="300" y="214">Reel 3</text>
  </g>
</svg>
